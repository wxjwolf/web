<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV直播API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .api-info {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .api-url {
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-family: monospace;
            word-break: break-all;
        }
        
        .control-panel {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        select, button {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            background: rgba(255,255,255,0.9);
            color: #333;
            cursor: pointer;
        }
        
        button {
            background: #ff6b6b;
            color: white;
            font-weight: bold;
        }
        
        .quality-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .quality-btn {
            flex: 1;
            padding: 10px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            color: white;
            cursor: pointer;
            text-align: center;
        }
        
        .quality-btn.active {
            background: #4CAF50;
            border-color: #4CAF50;
        }
        
        .video-container {
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        video {
            width: 100%;
            max-width: 800px;
            border-radius: 10px;
        }
        
        .status {
            text-align: center;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
        }
        
        .error {
            background: rgba(244, 67, 54, 0.8);
        }
        
        .success {
            background: rgba(76, 175, 80, 0.8);
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .channel-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        
        .channel-btn {
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            text-align: center;
        }
        
        .channel-btn.active {
            background: #2196F3;
            border-color: #2196F3;
        }
        
        .json-output {
            background: rgba(0,0,0,0.7);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📺 CCTV直播API</h1>
            <p>静态页面调用CCTV直播流</p>
        </header>
        
        <div class="api-info">
            <h3>API调用方式：</h3>
            <div class="api-url" id="apiUrl">正在生成URL...</div>
            <p>支持参数：id=频道ID, q=画质(lg/蓝光, cq/超清, gq/高清)</p>
        </div>
        
        <div class="control-panel">
            <div class="form-group">
                <label for="channel">选择频道:</label>
                <select id="channel">
                    <option value="cctv1">CCTV-1 综合</option>
                    <option value="cctv2">CCTV-2 财经</option>
                    <option value="cctv4">CCTV-4 中文国际</option>
                    <option value="cctv7">CCTV-7 国防军事</option>
                    <option value="cctv9">CCTV-9 纪录</option>
                    <option value="cctv10">CCTV-10 科教</option>
                    <option value="cctv12">CCTV-12 社会与法</option>
                    <option value="cctv13">CCTV-13 新闻</option>
                    <option value="cctv17">CCTV-17 农业农村</option>
                    <option value="cctv4k">CCTV-4K 超高清</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>选择画质:</label>
                <div class="quality-buttons">
                    <button class="quality-btn active" data-quality="lg">蓝光</button>
                    <button class="quality-btn" data-quality="cq">超清</button>
                    <button class="quality-btn" data-quality="gq">高清</button>
                </div>
            </div>
            
            <button id="playBtn">🎬 获取直播流</button>
            <button id="jsonBtn" style="background: #2196F3; margin-top: 10px;">📋 获取JSON数据</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在获取直播流...</p>
        </div>
        
        <div class="status" id="status">等待操作...</div>
        
        <div class="video-container">
            <video id="videoPlayer" controls muted playsinline>
                视频加载后将显示在这里
            </video>
        </div>
        
        <div class="json-output" id="jsonOutput" style="display: none;">
            {/* JSON数据将显示在这里 */}
        </div>
        
        <div class="channel-list">
            <div class="channel-btn active" data-channel="cctv1">CCTV-1</div>
            <div class="channel-btn" data-channel="cctv2">CCTV-2</div>
            <div class="channel-btn" data-channel="cctv4">CCTV-4</div>
            <div class="channel-btn" data-channel="cctv7">CCTV-7</div>
            <div class="channel-btn" data-channel="cctv9">CCTV-9</div>
            <div class="channel-btn" data-channel="cctv10">CCTV-10</div>
            <div class="channel-btn" data-channel="cctv12">CCTV-12</div>
            <div class="channel-btn" data-channel="cctv13">CCTV-13</div>
            <div class="channel-btn" data-channel="cctv17">CCTV-17</div>
            <div class="channel-btn" data-channel="cctv4k">CCTV-4K</div>
        </div>
    </div>

    <script>
        // 频道映射
        const channelMap = {
            'cctv1': '11200132825562653886',
            'cctv2': '12030532124776958103', 
            'cctv4': '10620168294224708952',
            'cctv7': '8516529981177953694',
            'cctv9': '7252237247689203957',
            'cctv10': '14589146016461298119',
            'cctv12': '13180385922471124325',
            'cctv13': '16265686808730585228',
            'cctv17': '4496917190172866934',
            'cctv4k': '2127841942201075403'
        };

        let currentQuality = 'lg';
        let currentChannel = 'cctv1';

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateApiUrl();
            
            // 事件监听
            document.querySelectorAll('.quality-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentQuality = this.dataset.quality;
                    updateApiUrl();
                });
            });

            document.querySelectorAll('.channel-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentChannel = this.dataset.channel;
                    document.getElementById('channel').value = currentChannel;
                    updateApiUrl();
                });
            });

            document.getElementById('channel').addEventListener('change', function() {
                currentChannel = this.value;
                document.querySelectorAll('.channel-btn').forEach(b => {
                    b.classList.remove('active');
                    if (b.dataset.channel === currentChannel) b.classList.add('active');
                });
                updateApiUrl();
            });

            document.getElementById('playBtn').addEventListener('click', getLiveStream);
            document.getElementById('jsonBtn').addEventListener('click', getJsonData);
            
            // 检查URL参数
            const urlParams = new URLSearchParams(window.location.search);
            const urlId = urlParams.get('id');
            const urlQ = urlParams.get('q');
            
            if (urlId && channelMap[urlId]) {
                currentChannel = urlId;
                document.getElementById('channel').value = currentChannel;
                document.querySelectorAll('.channel-btn').forEach(b => {
                    b.classList.remove('active');
                    if (b.dataset.channel === currentChannel) b.classList.add('active');
                });
            }
            
            if (urlQ && ['lg', 'cq', 'gq'].includes(urlQ)) {
                currentQuality = urlQ;
                document.querySelectorAll('.quality-btn').forEach(b => {
                    b.classList.remove('active');
                    if (b.dataset.quality === currentQuality) b.classList.add('active');
                });
            }
            
            updateApiUrl();
            
            // 如果有URL参数，自动获取
            if (urlId || urlQ) {
                setTimeout(getLiveStream, 1000);
            }
        });

        function updateApiUrl() {
            const apiUrl = `${window.location.origin}${window.location.pathname}?id=${currentChannel}&q=${currentQuality}`;
            document.getElementById('apiUrl').textContent = apiUrl;
        }

        async function getLiveStream() {
            const loading = document.getElementById('loading');
            const status = document.getElementById('status');
            const video = document.getElementById('videoPlayer');
            const jsonOutput = document.getElementById('jsonOutput');
            
            loading.style.display = 'block';
            status.textContent = '正在获取直播流...';
            status.className = 'status';
            video.style.display = 'none';
            jsonOutput.style.display = 'none';

            try {
                // 使用CORS代理来绕过跨域限制
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const targetUrl = `https://cors-proxy.example.com/cctv-proxy?id=${currentChannel}&q=${currentQuality}`;
                
                // 这里使用一个公开的CORS代理服务
                const response = await fetch(proxyUrl + encodeURIComponent(targetUrl));
                
                if (!response.ok) {
                    throw new Error(`网络请求失败: ${response.status}`);
                }

                const data = await response.text();
                
                // 如果是M3U8链接，直接设置视频源
                if (data.includes('.m3u8') || data.startsWith('http')) {
                    status.textContent = '直播流获取成功！';
                    status.className = 'status success';
                    video.src = data;
                    video.style.display = 'block';
                    
                    video.onloadeddata = function() {
                        loading.style.display = 'none';
                        video.play().catch(e => {
                            status.textContent = '请手动点击播放按钮';
                        });
                    };

                    video.onerror = function() {
                        loading.style.display = 'none';
                        status.textContent = '视频加载失败';
                        status.className = 'status error';
                    };
                } else {
                    // 如果是JSON数据，显示在输出区域
                    try {
                        const jsonData = JSON.parse(data);
                        showJsonOutput(jsonData);
                    } catch (e) {
                        throw new Error('返回数据格式错误');
                    }
                }

            } catch (error) {
                console.error('获取直播流错误:', error);
                loading.style.display = 'none';
                status.textContent = `错误: ${error.message}`;
                status.className = 'status error';
                
                // 显示备用方案
                showFallbackStream();
            }
        }

        async function getJsonData() {
            const loading = document.getElementById('loading');
            const status = document.getElementById('status');
            const jsonOutput = document.getElementById('jsonOutput');
            
            loading.style.display = 'block';
            status.textContent = '正在获取JSON数据...';
            status.className = 'status';
            jsonOutput.style.display = 'none';

            try {
                // 模拟API响应
                const mockData = {
                    success: true,
                    channel: currentChannel,
                    quality: currentQuality,
                    url: `https://example.com/live/${currentChannel}_${currentQuality}.m3u8`,
                    timestamp: Date.now(),
                    info: '这是一个模拟的API响应'
                };
                
                showJsonOutput(mockData);
                loading.style.display = 'none';
                status.textContent = 'JSON数据获取成功！';
                status.className = 'status success';
                
            } catch (error) {
                loading.style.display = 'none';
                status.textContent = `获取JSON数据失败: ${error.message}`;
                status.className = 'status error';
            }
        }

        function showJsonOutput(data) {
            const jsonOutput = document.getElementById('jsonOutput');
            jsonOutput.textContent = JSON.stringify(data, null, 2);
            jsonOutput.style.display = 'block';
        }

        function showFallbackStream() {
            // 使用公开的备用直播源
            const publicStreams = {
                'cctv1': 'https://cctvcnch5.v.wscdns.com/live/cctv1_2/index.m3u8',
                'cctv2': 'https://cctvcnch5.v.wscdns.com/live/cctv2_2/index.m3u8',
                'cctv4': 'https://cctvcnch5.v.wscdns.com/live/cctv4_2/index.m3u8',
                'cctv13': 'https://cctvcnch5.v.wscdns.com/live/cctv13/index.m3u8'
            };
            
            const status = document.getElementById('status');
            const video = document.getElementById('videoPlayer');
            
            if (publicStreams[currentChannel]) {
                status.innerHTML = '使用备用直播源...';
                video.src = publicStreams[currentChannel];
                video.style.display = 'block';
                video.play().catch(e => {
                    status.textContent = '请手动点击播放按钮';
                });
            }
        }

        // 工具函数：生成UUID
        function createUuid() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // 工具函数：Base64编码
        function base64Encode(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        // 工具函数：Base64解码
        function base64Decode(str) {
            return decodeURIComponent(escape(atob(str)));
        }
    </script>
</body>
</html>
