<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV直播流获取</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #1a1a1a;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #ff6b6b;
        }
        
        .control-panel {
            background: #2d2d2d;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ccc;
        }
        
        select, button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            background: #444;
            color: white;
            cursor: pointer;
        }
        
        button {
            background: #ff6b6b;
            font-weight: bold;
            margin-top: 10px;
        }
        
        button:hover {
            background: #ff5252;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .quality-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .quality-btn {
            flex: 1;
            padding: 10px;
            background: #444;
            border: 2px solid #555;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            text-align: center;
        }
        
        .quality-btn.active {
            background: #4CAF50;
            border-color: #4CAF50;
        }
        
        .video-container {
            background: #000;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        video {
            width: 100%;
            max-width: 800px;
            border-radius: 8px;
        }
        
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            background: #333;
            text-align: center;
        }
        
        .error {
            background: #d32f2f;
        }
        
        .success {
            background: #388e3c;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 3px solid #555;
            border-radius: 50%;
            border-top: 3px solid #ff6b6b;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .url-display {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.9rem;
        }
        
        .channel-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
            margin-top: 15px;
        }
        
        .channel-btn {
            padding: 10px;
            background: #444;
            border: 1px solid #555;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
        }
        
        .channel-btn.active {
            background: #2196F3;
            border-color: #2196F3;
        }
        
        .debug-info {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 0.8rem;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔴 CCTV直播流获取</h1>
            <p>基于央视新闻官方API的纯前端解决方案</p>
        </header>
        
        <div class="control-panel">
            <div class="form-group">
                <label for="channel">选择频道:</label>
                <select id="channel">
                    <option value="cctv1">CCTV-1 综合</option>
                    <option value="cctv2">CCTV-2 财经</option>
                    <option value="cctv4">CCTV-4 中文国际</option>
                    <option value="cctv7">CCTV-7 国防军事</option>
                    <option value="cctv9">CCTV-9 纪录</option>
                    <option value="cctv10">CCTV-10 科教</option>
                    <option value="cctv12">CCTV-12 社会与法</option>
                    <option value="cctv13">CCTV-13 新闻</option>
                    <option value="cctv17">CCTV-17 农业农村</option>
                    <option value="cctv4k">CCTV-4K 超高清</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>选择画质:</label>
                <div class="quality-buttons">
                    <button class="quality-btn active" data-quality="lg">蓝光</button>
                    <button class="quality-btn" data-quality="cq">超清</button>
                    <button class="quality-btn" data-quality="gq">高清</button>
                </div>
            </div>
            
            <button id="getStreamBtn">🚀 获取直播流</button>
            <button id="debugBtn" style="background: #666; margin-top: 5px;">🐛 调试信息</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在获取直播流...</p>
        </div>
        
        <div class="status" id="status">等待操作</div>
        
        <div class="url-display" id="urlDisplay" style="display: none;">
            <strong>直播流URL:</strong><br>
            <span id="streamUrl"></span>
        </div>
        
        <div class="video-container">
            <video id="videoPlayer" controls muted playsinline>
                直播流将显示在这里
            </video>
        </div>
        
        <div class="channel-list">
            <div class="channel-btn active" data-channel="cctv1">CCTV-1</div>
            <div class="channel-btn" data-channel="cctv2">CCTV-2</div>
            <div class="channel-btn" data-channel="cctv4">CCTV-4</div>
            <div class="channel-btn" data-channel="cctv7">CCTV-7</div>
            <div class="channel-btn" data-channel="cctv9">CCTV-9</div>
            <div class="channel-btn" data-channel="cctv10">CCTV-10</div>
            <div class="channel-btn" data-channel="cctv12">CCTV-12</div>
            <div class="channel-btn" data-channel="cctv13">CCTV-13</div>
            <div class="channel-btn" data-channel="cctv17">CCTV-17</div>
            <div class="channel-btn" data-channel="cctv4k">CCTV-4K</div>
        </div>
        
        <div class="debug-info" id="debugInfo"></div>
    </div>

    <script>
        // 频道映射
        const channelMap = {
            'cctv1': '11200132825562653886',
            'cctv2': '12030532124776958103', 
            'cctv4': '10620168294224708952',
            'cctv7': '8516529981177953694',
            'cctv9': '7252237247689203957',
            'cctv10': '14589146016461298119',
            'cctv12': '13180385922471124325',
            'cctv13': '16265686808730585228',
            'cctv17': '4496917190172866934',
            'cctv4k': '2127841942201075403'
        };

        let currentQuality = 'lg';
        let currentChannel = 'cctv1';
        let debugMode = false;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 事件监听
            document.querySelectorAll('.quality-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentQuality = this.dataset.quality;
                });
            });

            document.querySelectorAll('.channel-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentChannel = this.dataset.channel;
                    document.getElementById('channel').value = currentChannel;
                });
            });

            document.getElementById('channel').addEventListener('change', function() {
                currentChannel = this.value;
                document.querySelectorAll('.channel-btn').forEach(b => {
                    b.classList.remove('active');
                    if (b.dataset.channel === currentChannel) b.classList.add('active');
                });
            });

            document.getElementById('getStreamBtn').addEventListener('click', getLiveStream);
            document.getElementById('debugBtn').addEventListener('click', toggleDebug);
            
            // 检查URL参数
            const urlParams = new URLSearchParams(window.location.search);
            const urlId = urlParams.get('id');
            const urlQ = urlParams.get('q');
            
            if (urlId && channelMap[urlId]) {
                currentChannel = urlId;
                document.getElementById('channel').value = currentChannel;
                document.querySelectorAll('.channel-btn').forEach(b => {
                    b.classList.remove('active');
                    if (b.dataset.channel === currentChannel) b.classList.add('active');
                });
            }
            
            if (urlQ && ['lg', 'cq', 'gq'].includes(urlQ)) {
                currentQuality = urlQ;
                document.querySelectorAll('.quality-btn').forEach(b => {
                    b.classList.remove('active');
                    if (b.dataset.quality === currentQuality) b.classList.add('active');
                });
            }
            
            // 如果有URL参数，自动获取
            if (urlId || urlQ) {
                setTimeout(getLiveStream, 500);
            }
        });

        async function getLiveStream() {
            const loading = document.getElementById('loading');
            const status = document.getElementById('status');
            const video = document.getElementById('videoPlayer');
            const urlDisplay = document.getElementById('urlDisplay');
            const getStreamBtn = document.getElementById('getStreamBtn');
            
            loading.style.display = 'block';
            status.textContent = '正在获取直播流...';
            status.className = 'status';
            video.style.display = 'none';
            urlDisplay.style.display = 'none';
            getStreamBtn.disabled = true;

            try {
                const articleId = channelMap[currentChannel];
                if (!articleId) {
                    throw new Error('不支持的频道');
                }

                const t = Math.floor(Date.now() / 1000);
                
                // 生成签名
                const sail = await sha256(`articleId=${articleId}&scene_type=6`);
                const w = `&&&20000009&${sail}&${t}&emas.feed.article.live.detail&1.0.0&&&&&`;
                const k = "emasgatewayh5";
                const sign = await hmacSHA256(w, k);
                
                // 构建请求头
                const clientId = await sha256(t.toString());
                const headers = {
                    'cookieuid': clientId,
                    'from-client': 'h5',
                    'referer': 'https://m-live.cctvnews.cctv.com/',
                    'x-emas-gw-appkey': '20000009',
                    'x-emas-gw-pv': '6.1',
                    'x-emas-gw-sign': sign,
                    'x-emas-gw-t': t.toString(),
                    'x-req-ts': (t * 1000).toString(),
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                };

                status.textContent = '请求API数据...';
                addDebugInfo(`请求URL: https://emas-api.cctvnews.cctv.com/h5/emas.feed.article.live.detail/1.0.0?articleId=${articleId}&scene_type=6`);

                // 获取直播数据
                const apiUrl = `https://emas-api.cctvnews.cctv.com/h5/emas.feed.article.live.detail/1.0.0?articleId=${articleId}&scene_type=6`;
                const response = await fetch(apiUrl, { headers });
                
                if (!response.ok) {
                    throw new Error(`API请求失败: ${response.status}`);
                }

                const data = await response.json();
                addDebugInfo(`API响应: ${JSON.stringify(data).substring(0, 500)}...`);

                // 解码响应数据
                const decodedResponse = atob(data.response);
                const responseData = JSON.parse(decodedResponse);
                const liveData = responseData.data;

                // 获取对应画质的URL
                let authUrl;
                const authResult = liveData.live_room.liveCameraList[0].pullUrlList[0].authResultUrl[0];
                
                if (currentQuality === 'lg') {
                    authUrl = authResult.authUrl;
                } else if (currentQuality === 'cq') {
                    authUrl = authResult.demote_urls[1].authUrl;
                } else if (currentQuality === 'gq') {
                    authUrl = authResult.demote_urls[0].authUrl;
                } else {
                    throw new Error('不支持的画质参数');
                }

                addDebugInfo(`加密URL: ${authUrl.substring(0, 100)}...`);

                // 解密URL
                const dk = liveData.dk;
                const key = dk.substring(0, 8) + t.toString().slice(-8);
                const iv = dk.substring(dk.length - 8) + t.toString().substring(0, 8);
                
                status.textContent = '解密直播地址...';
                const liveUrl = await decryptAES(authUrl, key, iv);

                addDebugInfo(`解密后的URL: ${liveUrl}`);

                // 显示URL并播放视频
                document.getElementById('streamUrl').textContent = liveUrl;
                urlDisplay.style.display = 'block';
                
                status.textContent = '准备播放...';
                status.className = 'status success';
                video.src = liveUrl;
                video.style.display = 'block';
                
                video.onloadeddata = function() {
                    loading.style.display = 'none';
                    status.textContent = `正在播放: ${currentChannel.toUpperCase()} - ${getQualityText(currentQuality)}`;
                    video.play().catch(e => {
                        status.textContent = '自动播放被阻止，请手动点击播放';
                    });
                };

                video.onerror = function() {
                    loading.style.display = 'none';
                    status.textContent = '视频加载失败，请检查URL或网络连接';
                    status.className = 'status error';
                };

            } catch (error) {
                console.error('获取直播流错误:', error);
                loading.style.display = 'none';
                status.textContent = `错误: ${error.message}`;
                status.className = 'status error';
                addDebugInfo(`错误: ${error.message}`);
            } finally {
                getStreamBtn.disabled = false;
            }
        }

        // 加密工具函数
        async function sha256(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function hmacSHA256(message, key) {
            const encoder = new TextEncoder();
            const keyData = encoder.encode(key);
            const messageData = encoder.encode(message);
            
            const cryptoKey = await crypto.subtle.importKey(
                'raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
            );
            
            const signature = await crypto.subtle.sign('HMAC', cryptoKey, messageData);
            return Array.from(new Uint8Array(signature)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function decryptAES(encryptedData, key, iv) {
            try {
                // Base64解码
                const encryptedBytes = Uint8Array.from(atob(encryptedData), c => c.charCodeAt(0));
                const keyBytes = new TextEncoder().encode(key);
                const ivBytes = new TextEncoder().encode(iv);
                
                // 导入密钥
                const cryptoKey = await crypto.subtle.importKey(
                    'raw', keyBytes, { name: 'AES-CBC' }, false, ['decrypt']
                );
                
                // 解密
                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-CBC', iv: ivBytes },
                    cryptoKey,
                    encryptedBytes
                );
                
                return new TextDecoder().decode(decrypted);
            } catch (error) {
                throw new Error('AES解密失败: ' + error.message);
            }
        }

        function getQualityText(quality) {
            const qualityMap = {
                'lg': '蓝光',
                'cq': '超清', 
                'gq': '高清'
            };
            return qualityMap[quality] || quality;
        }

        function toggleDebug() {
            const debugInfo = document.getElementById('debugInfo');
            debugMode = !debugMode;
            debugInfo.style.display = debugMode ? 'block' : 'none';
            document.getElementById('debugBtn').textContent = debugMode ? '🐛 隐藏调试' : '🐛 调试信息';
        }

        function addDebugInfo(message) {
            if (debugMode) {
                const debugInfo = document.getElementById('debugInfo');
                const timestamp = new Date().toLocaleTimeString();
                debugInfo.innerHTML += `[${timestamp}] ${message}<br>`;
                debugInfo.scrollTop = debugInfo.scrollHeight;
            }
        }
    </script>
</body>
</html>
